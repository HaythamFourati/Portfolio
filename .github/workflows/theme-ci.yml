name: Theme checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check PHP syntax (PHP 8.3 on Ubuntu 24.04)
        run: |
          php --version
          find . -name '*.php' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Check required production assets
        run: |
          test -s build/index.js
          test -s build/index.css
          test -s build/animations.js
